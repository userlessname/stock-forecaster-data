name: Fast Live Prices Update

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force execution (skip validations)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Print Runner System Specifications
        run: |
          echo "========================================================"
          echo "              RUNNER SYSTEM SPECIFICATIONS"
          echo "========================================================"
          echo "OS Details:"
          uname -a
          cat /etc/os-release | grep -E '^PRETTY_NAME=|^VERSION=' || true
          echo "--------------------------------------------------------"
          echo "CPU Details:"
          lscpu | grep -E 'Model name:|CPU\(s\):|Thread\(s\) per core:|Core\(s\) per socket:' || true
          echo "--------------------------------------------------------"
          echo "RAM Details:"
          free -h
          echo "--------------------------------------------------------"
          echo "Disk Details:"
          df -h | grep -E '^Filesystem|/$' || true
          echo "========================================================"

      - name: Detect System CPU Cores
        run: |
          CORES=$(nproc 2>/dev/null | tr -d '[:space:]' || echo 2)
          case "$CORES" in
            *[!0-9]*) CORES=2 ;;
            "") CORES=2 ;;
            *) ;;
          esac
          echo "DETECTED_CORES=$CORES" >> $GITHUB_ENV
          echo "System has $CORES CPU cores. Configuring thread limits accordingly."

      - name: Checkout Public Data Repo (for backend_files.txt)
        uses: actions/checkout@v4
        
      - name: Fetch Private Backend via Raw CDN (Ultimate Parallel Bypass)
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, time, urllib.error, urllib.request, concurrent.futures

          REPO = 'userlessname/stock-forecaster-app'
          RAW = f'https://raw.githubusercontent.com/{REPO}/main/'
          headers = {'Authorization': f"token {os.environ['PRIVATE_REPO_PAT']}", 'User-Agent': 'Python'}

          def get(url, attempts=4, retry_404=False):
              # This workflow fires every 5 minutes; a transient 429/5xx must not be
              # mistaken for a missing file. A 404 from raw.githubusercontent means the
              # file genuinely is not on `main`, so retrying it is pointless. The GitHub
              # REST API also answers 404 for "cannot see it right now" - a momentarily
              # rejected token, a rate-limit blip, replication lag just after a push - so
              # that caller opts in via retry_404. On 2026-08-17 13:55 the tree call 404'd
              # and killed the scan; the identical call succeeded at 16:20.
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if (e.code == 404 and not retry_404) or attempt == attempts - 1:
                          raise
                  except Exception:
                      if attempt == attempts - 1:
                          raise
                  time.sleep(2 ** attempt)

          print('Downloading backend_files.txt...')
          manifest = {line.strip() for line in get(RAW + 'backend/backend_files.txt').decode().splitlines() if line.strip()}

          # Manifest drift guard - see daily_scan.yml: a backend module that never made it
          # into backend_files.txt silently breaks the run at import time.
          # SAFETY NET for manifest drift, not a dependency. Killing the job when it
          # cannot be consulted inverts its own purpose, so it degrades to a warning:
          # backend_files.txt is a complete file list on its own, and the app repo now
          # guards it with backend/tests/test_backend_files_manifest.py.
          discovered = set()
          try:
              tree = json.loads(get(
                  f'https://api.github.com/repos/{REPO}/git/trees/main:backend?recursive=1',
                  retry_404=True))
              if tree.get('truncated'):
                  print('WARNING: git tree response truncated - drift guard skipped this run')
              else:
                  discovered = {'backend/' + e['path'] for e in tree['tree']
                                if e['type'] == 'blob' and e['path'].endswith('.py')}
          except Exception as exc:
              print(f'WARNING: drift guard unavailable ({exc!r}); using backend_files.txt alone')
          extra = discovered - manifest
          if extra:
              print(f'Manifest drift: {len(extra)} backend module(s) missing from backend_files.txt: ' + ', '.join(sorted(extra)))
          files = sorted(manifest | discovered)

          failures = []

          def download_file(filepath):
              os.makedirs(os.path.dirname(filepath) or '.', exist_ok=True)
              try:
                  with open(filepath, 'wb') as dest:
                      dest.write(get(RAW + filepath))
              except Exception as e:
                  failures.append((filepath, repr(e)))

          try:
              cores = int(os.environ.get('DETECTED_CORES', '2'))
          except Exception:
              cores = 2
          workers = min(cores * 10, 40)
          print(f'Downloading {len(files)} files in parallel using {workers} workers...')
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as executor:
              list(executor.map(download_file, files))

          if failures:
              for path, err in failures:
                  print(f'FAILED {path}: {err}')
              raise SystemExit(f'{len(failures)} backend file(s) failed to download')
          print('Successfully fetched all backend files!')
          PY

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Check US Market Status
        id: check
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: |
          python backend/check_market.py --force "${FORCE_RUN:-false}" --strict

      - name: Restore Lightweight Python Virtual Environment
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.scan_mode != 'sentiment_only'
        id: restore-venv
        uses: actions/cache/restore@v4
        with:
          path: backend/.venv-prices
          key: ${{ runner.os }}-venv-prices-v3
          restore-keys: |
            ${{ runner.os }}-venv-prices-

      - name: Install Lightweight Dependencies
        if: (steps.check.outputs.should_run == 'true' && steps.check.outputs.scan_mode != 'sentiment_only') && steps.restore-venv.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "backend/.venv-prices" ]; then
            uv venv backend/.venv-prices
          fi
          uv pip install --python backend/.venv-prices httpx yfinance pandas lxml html5lib beautifulsoup4

      - name: Save Lightweight Python Virtual Environment Cache
        if: (steps.check.outputs.should_run == 'true' && steps.check.outputs.scan_mode != 'sentiment_only') && steps.restore-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/.venv-prices
          key: ${{ runner.os }}-venv-prices-v3



      - name: Run Live Prices Fetcher
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.scan_mode != 'sentiment_only'
        run: |
          # Without pipefail a crashed fetcher still exits 0, because the pipeline takes
          # timestamp_pipe.py's status (see daily_scan.yml).
          set -o pipefail
          backend/.venv-prices/bin/python -u backend/update_prices.py | backend/.venv-prices/bin/python -u backend/timestamp_pipe.py

      - name: Validate Live Prices Before Publishing
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.scan_mode != 'sentiment_only'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys

          path = pathlib.Path('backend/api/live_prices.json')
          if not path.is_file() or path.stat().st_size == 0:
              sys.exit('live_prices.json is missing or empty - refusing to publish')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception as e:
              sys.exit(f'live_prices.json is not valid JSON: {e}')
          if not data:
              sys.exit('live_prices.json holds no quotes - refusing to publish')
          print(f'live_prices.json validated: {len(data)} entries')
          PY

      - name: Deploy live_prices.json to GitHub Pages
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.scan_mode != 'sentiment_only'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PRIVATE_REPO_PAT }}
          external_repository: userlessname/stock-forecaster-data
          publish_dir: ./backend/api
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
