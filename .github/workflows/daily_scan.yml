name: Daily Market Scanner & AI Forecaster

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force execution (skip market open checks)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Print Runner System Specifications
        run: |
          echo "========================================================"
          echo "              RUNNER SYSTEM SPECIFICATIONS"
          echo "========================================================"
          echo "OS Details:"
          uname -a
          cat /etc/os-release | grep -E '^PRETTY_NAME=|^VERSION=' || true
          echo "--------------------------------------------------------"
          echo "CPU Details:"
          lscpu | grep -E 'Model name:|CPU\(s\):|Thread\(s\) per core:|Core\(s\) per socket:' || true
          echo "--------------------------------------------------------"
          echo "RAM Details:"
          free -h
          echo "--------------------------------------------------------"
          echo "Disk Details:"
          df -h | grep -E '^Filesystem|/$' || true
          echo "========================================================"

      - name: Detect System CPU Cores
        run: |
          CORES=$(nproc 2>/dev/null | tr -d '[:space:]' || echo 2)
          case "$CORES" in
            *[!0-9]*) CORES=2 ;;
            "") CORES=2 ;;
            *) ;;
          esac
          echo "DETECTED_CORES=$CORES" >> $GITHUB_ENV
          echo "System has $CORES CPU cores. Configuring thread limits accordingly."

      - name: Checkout Public Data Repo (for backend_files.txt)
        uses: actions/checkout@v4
        
      - name: Fetch Private Backend via Raw CDN (Ultimate Parallel Bypass)
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, time, random, urllib.request, concurrent.futures

          REPO = 'userlessname/stock-forecaster-app'
          RAW = f'https://raw.githubusercontent.com/{REPO}/main/'
          headers = {'Authorization': f"token {os.environ['PRIVATE_REPO_PAT']}", 'User-Agent': 'Python'}

          def get(url, attempts=5):
              # Download failures fail the job, so a transient failure must never be
              # mistaken for a missing file - and 404 IS a transient failure here. On a
              # PRIVATE repo, raw.githubusercontent answers a throttled or momentarily
              # rejected auth check with 404, not 401/403/429, to avoid leaking whether
              # the repo exists; the GitHub REST API does the same. At the HTTP layer
              # "rate-limited" is therefore indistinguishable from "not on `main`", so
              # every caller retries 404 and none of them opts out.
              # Treating 404 as proof of absence broke this step twice on 2026-08-17: at
              # 13:55 the tree call 404'd and killed the scan while the identical call
              # succeeded at 16:20, and at 17:48 four files that had been on `main` for
              # weeks 404'd inside a 2.4 s / 40-worker burst - in the same job whose tree
              # call had just listed one of them. A genuinely missing file still fails the
              # job, one retry budget later.
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read()
                  except Exception:
                      if attempt == attempts - 1:
                          raise
                  # Jitter: workers throttled at the same instant would otherwise retry in
                  # lockstep and re-trigger the very rate limit they are backing off from.
                  time.sleep(2 ** attempt + random.random())

          print('Downloading backend_files.txt...')
          manifest = {line.strip() for line in get(RAW + 'backend/backend_files.txt').decode().splitlines() if line.strip()}

          # Manifest drift guard: backend_files.txt is hand-maintained, so a newly added
          # module can be absent from it and the scan then dies with ModuleNotFoundError
          # (this is exactly what wiped the CDN on 2026-08-09). Union in every backend
          # Python module straight from the git tree so the manifest can never be the
          # reason a scan fails. The `main:backend` subtree keeps the response ~45 KB
          # instead of pulling the whole app repo's file list.
          # SAFETY NET for manifest drift, not a dependency. Killing the job when it
          # cannot be consulted inverts its own purpose, so it degrades to a warning:
          # backend_files.txt is a complete file list on its own, and the app repo now
          # guards it with backend/tests/test_backend_files_manifest.py.
          discovered = set()
          try:
              tree = json.loads(get(
                  f'https://api.github.com/repos/{REPO}/git/trees/main:backend?recursive=1'))
              if tree.get('truncated'):
                  print('WARNING: git tree response truncated - drift guard skipped this run')
              else:
                  discovered = {'backend/' + e['path'] for e in tree['tree']
                                if e['type'] == 'blob' and e['path'].endswith('.py')}
          except Exception as exc:
              print(f'WARNING: drift guard unavailable ({exc!r}); using backend_files.txt alone')
          extra = discovered - manifest
          if extra:
              print(f'Manifest drift: {len(extra)} backend module(s) missing from backend_files.txt: ' + ', '.join(sorted(extra)))
          files = sorted(manifest | discovered)

          failures = []

          def download_file(filepath):
              os.makedirs(os.path.dirname(filepath) or '.', exist_ok=True)
              try:
                  with open(filepath, 'wb') as dest:
                      dest.write(get(RAW + filepath))
              except Exception as e:
                  failures.append((filepath, repr(e)))

          try:
              cores = int(os.environ.get('DETECTED_CORES', '2'))
          except Exception:
              cores = 2
          # 40 concurrent workers pulled 140 files in 2.4 s (~58 req/s) on 2026-08-17 and
          # tripped GitHub's secondary rate limit, which a private repo reports as 404.
          # The retry in get() survives that; this keeps it from being provoked at all.
          workers = min(cores * 2, 8)
          print(f'Downloading {len(files)} files in parallel using {workers} workers...')
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as executor:
              list(executor.map(download_file, files))

          # Fail loudly: a silently missing module used to surface only as an
          # empty publish_dir, one step before the CDN got overwritten.
          if failures:
              for path, err in failures:
                  # Name the likely cause rather than leaving the next reader to re-derive
                  # it: a path the git tree listed seconds ago cannot be absent from `main`.
                  note = ' [tree-confirmed on main - transient, not a missing file]' if path in discovered else ''
                  print(f'FAILED {path}: {err}{note}')
              raise SystemExit(f'{len(failures)} backend file(s) failed to download')
          print('Successfully fetched all backend files!')
          PY

      - name: Set up uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: false
          cache-dependency-glob: "**/uv.lock"

      - name: Check US Market Status
        id: check
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: |
          python backend/check_market.py --force "${FORCE_RUN:-false}" --strict

      - name: Restore Python Virtual Environment
        if: steps.check.outputs.should_run == 'true'
        id: restore-venv
        uses: actions/cache/restore@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-venv-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Restore TA-Lib C Library
        if: steps.check.outputs.should_run == 'true'
        id: restore-ta-lib
        uses: actions/cache/restore@v4
        with:
          path: ~/ta-lib-install
          key: ${{ runner.os }}-ta-lib-v2

      - name: Install TA-Lib
        if: steps.check.outputs.should_run == 'true' && steps.restore-ta-lib.outputs.cache-hit != 'true'
        run: |
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=$HOME/ta-lib-install  # Local user prefix, no root required
          make
          make install  # Installs locally, no sudo required
          cd ..
          rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Save TA-Lib C Library Cache
        if: steps.check.outputs.should_run == 'true' && steps.restore-ta-lib.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ta-lib-install
          key: ${{ runner.os }}-ta-lib-v2

      - name: Sync Python Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          unset VIRTUAL_ENV
          export TA_INCLUDE_PATH="$HOME/ta-lib-install/include"
          export TA_LIBRARY_PATH="$HOME/ta-lib-install/lib"
          export LD_LIBRARY_PATH="$HOME/ta-lib-install/lib"
          uv sync --project backend

      - name: Save Python Virtual Environment Cache
        if: steps.check.outputs.should_run == 'true' && steps.restore-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-venv-${{ hashFiles('backend/uv.lock') }}

      - name: Restore Hugging Face Models
        if: steps.check.outputs.should_run == 'true'
        id: restore-hf-models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v2
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Pre-download Hugging Face Models
        if: steps.check.outputs.should_run == 'true'
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: |
          unset VIRTUAL_ENV
          export TA_INCLUDE_PATH="$HOME/ta-lib-install/include"
          export TA_LIBRARY_PATH="$HOME/ta-lib-install/lib"
          export LD_LIBRARY_PATH="$HOME/ta-lib-install/lib"
          uv run --project backend python -c "
          import timesfm
          timesfm.TimesFM_2p5_200M_torch.from_pretrained('google/timesfm-2.5-200m-pytorch')
          from transformers import AutoTokenizer, AutoModelForSequenceClassification
          AutoTokenizer.from_pretrained('ProsusAI/finbert')
          AutoModelForSequenceClassification.from_pretrained('ProsusAI/finbert')
          "

      - name: Save Hugging Face Models Cache
        if: steps.check.outputs.should_run == 'true' && steps.restore-hf-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-v2

      - name: Run Market Scan & Export to JSON
        if: steps.check.outputs.should_run == 'true'
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          HF_HUB_ENABLE_HF_TRANSFER: '1'  # Activates the Rust hf-transfer parallel downloader
          HF_HUB_OFFLINE: '1'             # Isolates scan execution from HuggingFace outages/network queries
          PYTHONUNBUFFERED: '1'
          # Dynamic thread pool allocation based on detected CPU cores
          OMP_NUM_THREADS: ${{ env.DETECTED_CORES }}
          MKL_NUM_THREADS: ${{ env.DETECTED_CORES }}
          OPENBLAS_NUM_THREADS: ${{ env.DETECTED_CORES }}
        run: |
          # pipefail is NOT a GitHub Actions default (the shell is `bash -e`). Without it
          # the scanner can die on the left-hand side of the pipe while timestamp_pipe.py
          # exits 0, turning a crashed scan into a green step - the failure mode that let
          # an empty publish_dir reach the deploy step on 2026-08-09.
          set -o pipefail
          unset VIRTUAL_ENV
          # Dynamically export path variables to prevent hardcoding /home/runner
          export TA_INCLUDE_PATH="$HOME/ta-lib-install/include"
          export TA_LIBRARY_PATH="$HOME/ta-lib-install/lib"
          export LD_LIBRARY_PATH="$HOME/ta-lib-install/lib"

          # uv run automatically handles venv creation, dependency compilation, and execution using uv.lock
          uv run --project backend python -u backend/run_scanner.py --export-json --mode ${{ steps.check.outputs.scan_mode }} | uv run --project backend python -u backend/timestamp_pipe.py

      - name: Validate Scan Output Before Publishing
        if: steps.check.outputs.should_run == 'true'
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import fnmatch, json, os, pathlib, sys, urllib.request

          # Last gate before the CDN is touched. run_scanner.py wraps the whole list
          # export in `except Exception: print(...)` and still exits 0, so a partial
          # backend/api arrives here looking exactly like a healthy one.
          api = pathlib.Path('backend/api')
          DIRS = (
              ('forecast', '*.json', 500),
              ('backtest', '*.json', 500),
              ('top', '*.json', 15),
              ('backtests', 'leaderboard*.json', 5),
          )
          # cache_db.json is the next scan's bootstrap input - run_scanner.py reads it
          # back off the CDN - so publishing a broken one poisons every later run.
          REQUIRED = ('indices.json', 'search.json', 'daily_scan_metadata.json',
                      'signal_inputs.json', 'cache_db.json')

          problems = []
          local = {}
          for name, pattern, floor in DIRS:
              d = api / name
              local[name] = len(list(d.glob(pattern))) if d.is_dir() else 0
              if local[name] < floor:
                  problems.append(f'{name}/: {local[name]} file(s), expected at least {floor}')

          for name in REQUIRED:
              path = api / name
              if not path.is_file() or path.stat().st_size == 0:
                  problems.append(f'{name}: missing or empty')
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as e:
                  problems.append(f'{name}: not valid JSON ({e})')

          # Regression guard: per-ticker export errors are swallowed one ticker at a time,
          # so a run can drop a slice of the universe and still clear the absolute floors.
          # Compare against what is already published instead.
          published = {}
          try:
              req = urllib.request.Request(
                  'https://api.github.com/repos/userlessname/stock-forecaster-data/git/trees/gh-pages?recursive=1',
                  headers={'Authorization': f"token {os.environ['PRIVATE_REPO_PAT']}", 'User-Agent': 'Python'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  tree = json.load(r)
              if tree.get('truncated'):
                  raise RuntimeError('published tree truncated')
              for name, pattern, _ in DIRS:
                  published[name] = sum(1 for e in tree['tree']
                                        if e['type'] == 'blob' and e['path'].startswith(name + '/')
                                        and fnmatch.fnmatch(e['path'].rsplit('/', 1)[-1], pattern))
          except Exception as e:
              # A CDN read hiccup must not block an otherwise healthy publish.
              print(f'WARN: skipping the regression check, could not read the published tree ({e})')

          for name, _, _ in DIRS:
              was = published.get(name, 0)
              if was and local[name] < was * 0.95:
                  problems.append(f'{name}/: {local[name]} file(s) against {was} already published (>5% drop)')

          if problems:
              print('Scan output validation FAILED - refusing to publish:')
              for p in problems:
                  print(f'  - {p}')
              sys.exit(1)

          print('Scan output validation passed:')
          for name, _, _ in DIRS:
              print(f'  {name}/: {local[name]} file(s) (published: {published.get(name, "unknown")})')
          PY

      # No pricing-asset preservation step: keep_files leaves live_prices.json and
      # update_prices_metadata.json untouched because the scan never writes them into
      # publish_dir. Re-fetching them from Pages only risked republishing a cached,
      # older quote set over the fresher one update_prices.yml had just pushed.
      - name: Deploy to GitHub Pages
        if: steps.check.outputs.should_run == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PRIVATE_REPO_PAT }}
          external_repository: userlessname/stock-forecaster-data
          publish_dir: ./backend/api
          publish_branch: gh-pages
          # force_orphan/keep_files:false means "delete the whole CDN, then upload
          # whatever is in publish_dir" - one bad export wipes every artifact and the
          # branch history with it. Additive publishing keeps a partial export partial.
          force_orphan: false
          keep_files: true
